<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A living 3D factory on Kepler-22b that visualizes your GitHub Actions builds and releases. Grain workers haul dependencies, stress-test products and launch releases into orbit." />
    <meta name="theme-color" content="#0b0f1a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f1a'/%3E%3Cpath d='M32 8c8 8 10 18 8 30H24c-2-12 0-22 8-30z' fill='%23f0eae1'/%3E%3Cpath d='M32 8c4 4 6.5 8 7.4 12H24.6c.9-4 3.400-8 7.400-12z' fill='%23dc2626'/%3E%3Ccircle cx='32' cy='28' r='4' fill='%237dd3fc'/%3E%3Cpath d='M24 34l-8 10 8-2zM40 34l8 10-8-2z' fill='%23dc2626'/%3E%3Cpath d='M28 42h8l-4 12z' fill='%23f59e0b'/%3E%3C/svg%3E" />
    <title>DirectedByMultiBay</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #app { position: fixed; inset: 0; }
      #app canvas { outline: none; touch-action: none; }
      #hud { position: fixed; top: 12px; left: 16px; color: #f0eae1; pointer-events: none;
        text-shadow: 0 1px 4px #000; }
      #hud h1 { margin: 0; font-size: 20px; letter-spacing: 0.08em; }
      #hud p { margin: 2px 0 0; font-size: 12px; opacity: 0.75; }
      .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
        clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
        padding: 24px; text-align: center; color: #f0eae1; font-size: 16px; line-height: 1.5; }
      :focus-visible { outline: 2px solid #35e0ff; outline-offset: 2px; }
      @media (max-width: 700px) {
        #hud { top: 8px; left: 12px; }
        #hud h1 { font-size: 15px; }
        #hud p { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app" role="application" aria-label="3D factory view. Drag to rotate, scroll or pinch to zoom, arrow keys to pan."></div>
    <div id="hud"><h1>DIRECTED BY MULTIBAY</h1><p>Kepler-22b factory &middot; live GitHub Actions</p></div>
    <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
    <div id="fallback" role="alert">This page draws a 3D factory and needs WebGL, which your browser or device is not providing. Try a recent Chrome, Edge, Firefox or Safari.</div>
    <noscript><p style="color:#f0eae1;padding:24px">DirectedByMultiBay needs JavaScript to draw its 3D factory.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
